name: Customer Accounts CI

on:
  push:
    branches: [main, sprint-2, sprint-3]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with Flake8
        run: flake8 service tests

      - name: Run tests
        run: nosetests tests/test_routes.py -v

      - name: Check test coverage
        run: |
          coverage run -m nose tests/test_routes.py
          coverage report --fail-under=95
